<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; font-family: sans-serif; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; padding: 16px; box-sizing: border-box; }
  #captcha { width: 100%; max-width: 360px; }
  #hint { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #9AA0A9; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap"><div id="captcha"></div></div>
<div id="hint">完成人机验证后会自动继续</div>
<script src="https://castatic.fengkongcloud.cn/pr/v1.0.4/smcp.min.js"></script>
<script>
window._smConf = {
  organization: "P9usCUBauxft8eAmUXaZ",
  appId: "default",
  publicKey: "MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDetfEgYD4aE1ZjmWJ6/jnPurhzI+yeRoJHWrnNtQMte3stQ4VjG3yu21FuN75E6cDpA9KtDXwcB2M/FiGUAe3G0rNotbWI8+SjZfUbW/OILFTzY0uaeEkmVGW5WyJ6weQbbr1xTCPa2OO3YIMeZljWUYHG5h21WAm/PATg8im8cQIDAQAB",
  staticHost: location.host,
  protocol: "https"
};
function post(obj) {
  try { window.AndroidCaptcha.postMessage(JSON.stringify(obj)); } catch (e) {}
}
function start() {
  if (typeof initSMCaptcha !== "function") {
    post({ error: "initSMCaptcha missing" });
    return;
  }
  initSMCaptcha(
    {
      organization: "P9usCUBauxft8eAmUXaZ",
      appendTo: "captcha",
      mode: "inline",
      lang: "zh",
      maskBindClose: false,
      onError: function (type, detail) {
        post({ error: String(type), code: detail && detail.code, message: detail && detail.message });
      }
    },
    function (instance) {
      if (!instance) { post({ error: "no instance" }); return; }
      post({ stage: "init", keys: Object.keys(instance).join(","), onSuccess: typeof instance.onSuccess, instant: instance.instantValue ? JSON.stringify(instance.instantValue).slice(0, 200) : "" });
      if (typeof instance.onSuccess === "function") {
        instance.onSuccess(function (r) {
          post(Object.assign({ stage: "success" }, r || {}));
        });
      }
      if (typeof instance.onError === "function") {
        instance.onError(function (type, detail) {
          post({ stage: "error", error: String(type), code: detail && detail.code, message: detail && detail.message });
        });
      }
    }
  );
}
window.addEventListener("load", function () { setTimeout(start, 300); });
</script>
</body>
</html>
